<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 108" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges">
  <!-- Original PulseVanilla artwork: an amethyst geode cave -->
  <defs>
    <pattern id="deep" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#17151d"/>
      <rect x="0" y="1" width="4" height="1" fill="#211e29"/>
      <rect x="4" y="4" width="4" height="1" fill="#211e29"/>
      <rect x="1" y="6" width="2" height="1" fill="#0f0e14"/>
    </pattern>
    <pattern id="ame" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#5b2fa0"/>
      <rect x="1" y="1" width="2" height="2" fill="#8a57de"/>
      <rect x="5" y="2" width="2" height="1" fill="#b48cff"/>
      <rect x="2" y="5" width="3" height="1" fill="#7442c4"/>
      <rect x="6" y="5" width="1" height="2" fill="#40207a"/>
      <rect x="1" y="1" width="1" height="1" fill="#d8c2ff"/>
    </pattern>
    <radialGradient id="glow" cx="96" cy="60" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c77dff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="192" height="108" fill="url(#deep)"/>
  <!-- calcite ring -->
  <g fill="#cfcad8" opacity=".55">
    <rect x="34" y="14" width="124" height="4"/><rect x="26" y="18" width="140" height="4"/>
    <rect x="18" y="22" width="156" height="66"/><rect x="26" y="88" width="140" height="4"/><rect x="34" y="92" width="124" height="4"/>
  </g>
  <!-- amethyst shell -->
  <rect x="40" y="18" width="112" height="74" fill="url(#ame)"/>
  <rect x="24" y="26" width="144" height="58" fill="url(#ame)"/>
  <!-- hollow -->
  <rect x="48" y="30" width="96" height="50" fill="#120c1c"/>
  <rect x="36" y="38" width="120" height="34" fill="#120c1c"/>
  <rect width="192" height="108" fill="url(#glow)"/>
  <!-- clusters on the floor -->
  <g fill="#b48cff">
    <rect x="52" y="74" width="2" height="6"/><rect x="50" y="77" width="2" height="3"/><rect x="54" y="76" width="2" height="4"/>
    <rect x="74" y="70" width="2" height="10"/><rect x="72" y="74" width="2" height="6"/><rect x="76" y="73" width="2" height="7"/>
    <rect x="98" y="72" width="2" height="8"/><rect x="96" y="76" width="2" height="4"/><rect x="100" y="75" width="2" height="5"/>
    <rect x="122" y="70" width="2" height="10"/><rect x="120" y="74" width="2" height="6"/><rect x="124" y="72" width="2" height="8"/>
    <rect x="140" y="75" width="2" height="5"/><rect x="142" y="73" width="2" height="7"/>
  </g>
  <g fill="#ecdfff">
    <rect x="52" y="74" width="1" height="2"/><rect x="74" y="70" width="1" height="3"/><rect x="98" y="72" width="1" height="2"/>
    <rect x="122" y="70" width="1" height="3"/><rect x="142" y="73" width="1" height="2"/>
  </g>
  <!-- clusters on the ceiling -->
  <g fill="#9a6ae8">
    <rect x="60" y="30" width="2" height="7"/><rect x="62" y="30" width="2" height="4"/>
    <rect x="86" y="30" width="2" height="9"/><rect x="84" y="30" width="2" height="5"/>
    <rect x="112" y="30" width="2" height="6"/><rect x="114" y="30" width="2" height="9"/>
    <rect x="132" y="30" width="2" height="5"/>
  </g>
  <g fill="#e6d6ff" opacity=".8">
    <rect x="44" y="50" width="1" height="1"/><rect x="70" y="46" width="1" height="1"/><rect x="104" y="44" width="1" height="1"/>
    <rect x="130" y="52" width="1" height="1"/><rect x="150" y="48" width="1" height="1"/><rect x="92" y="56" width="1" height="1"/>
  </g>
</svg>
