<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 108" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges">
  <!-- Original PulseVanilla artwork inspired by a game server list on a dirt background -->
  <defs>
    <pattern id="dirt" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#4d3423"/>
      <rect x="1" y="1" width="2" height="1" fill="#6a4a31"/>
      <rect x="5" y="2" width="1" height="2" fill="#3a2619"/>
      <rect x="2" y="4" width="1" height="1" fill="#7a5638"/>
      <rect x="4" y="5" width="3" height="1" fill="#5c3f2a"/>
      <rect x="0" y="6" width="1" height="2" fill="#3a2619"/>
      <rect x="6" y="7" width="1" height="1" fill="#6a4a31"/>
    </pattern>
  </defs>
  <rect width="192" height="108" fill="url(#dirt)"/>
  <rect width="192" height="108" fill="#0a0612" opacity=".62"/>
  <!-- list panel -->
  <rect x="0" y="12" width="192" height="84" fill="#000" opacity=".35"/>
  <!-- row 1 (selected) -->
  <rect x="40" y="18" width="112" height="22" fill="#000" opacity=".55"/>
  <g fill="#c084fc">
    <rect x="40" y="18" width="112" height="1"/><rect x="40" y="39" width="112" height="1"/>
    <rect x="40" y="18" width="1" height="22"/><rect x="151" y="18" width="1" height="22"/>
  </g>
  <rect x="43" y="21" width="16" height="16" fill="#1c1030"/>
  <g transform="translate(43 21)">
    <rect x="7" y="2" width="2" height="1" fill="#c4b5fd"/><rect x="6" y="3" width="4" height="1" fill="#a78bfa"/>
    <rect x="5" y="4" width="6" height="7" fill="#8b5cf6"/><rect x="9" y="4" width="2" height="7" fill="#6d28d9"/>
    <rect x="6" y="11" width="4" height="1" fill="#6d28d9"/><rect x="7" y="12" width="2" height="1" fill="#4c1d95"/>
    <rect x="6" y="5" width="1" height="2" fill="#f5f3ff"/>
  </g>
  <rect x="63" y="22" width="44" height="3" fill="#ffffff"/>
  <rect x="63" y="28" width="62" height="2" fill="#bdb3d6"/>
  <rect x="63" y="32" width="40" height="2" fill="#bdb3d6" opacity=".7"/>
  <g fill="#5bff3c">
    <rect x="138" y="27" width="1" height="2"/><rect x="140" y="26" width="1" height="3"/><rect x="142" y="25" width="1" height="4"/>
    <rect x="144" y="24" width="1" height="5"/><rect x="146" y="23" width="1" height="6"/>
  </g>
  <!-- row 2 -->
  <rect x="40" y="44" width="112" height="22" fill="#000" opacity=".4"/>
  <rect x="43" y="47" width="16" height="16" fill="#5f3d27"/><rect x="43" y="47" width="16" height="4" fill="#4f9a3d"/>
  <rect x="63" y="48" width="36" height="3" fill="#d8d2e6" opacity=".8"/>
  <rect x="63" y="54" width="56" height="2" fill="#8f87a6"/><rect x="63" y="58" width="30" height="2" fill="#8f87a6" opacity=".7"/>
  <g fill="#8f87a6" opacity=".7">
    <rect x="138" y="53" width="1" height="2"/><rect x="140" y="52" width="1" height="3"/><rect x="142" y="51" width="1" height="4"/>
    <rect x="144" y="50" width="1" height="5"/><rect x="146" y="49" width="1" height="6"/>
  </g>
  <!-- row 3 -->
  <rect x="40" y="70" width="112" height="22" fill="#000" opacity=".3"/>
  <rect x="43" y="73" width="16" height="16" fill="#55525e"/><rect x="47" y="77" width="8" height="8" fill="#6d6a78"/>
  <rect x="63" y="74" width="30" height="3" fill="#d8d2e6" opacity=".6"/>
  <rect x="63" y="80" width="50" height="2" fill="#8f87a6" opacity=".7"/><rect x="63" y="84" width="34" height="2" fill="#8f87a6" opacity=".5"/>
  <!-- buttons -->
  <g fill="#6e6a78" opacity=".55">
    <rect x="40" y="99" width="34" height="6"/><rect x="79" y="99" width="34" height="6"/><rect x="118" y="99" width="34" height="6"/>
  </g>
  <rect x="40" y="99" width="34" height="6" fill="#8b5cf6" opacity=".7"/>
</svg>
