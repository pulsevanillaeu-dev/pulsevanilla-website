<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 108" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges">
  <!-- Original PulseVanilla artwork: survival landscape at a purple dusk -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140828"/>
      <stop offset=".45" stop-color="#4a1f74"/>
      <stop offset=".75" stop-color="#b04c8f"/>
      <stop offset="1" stop-color="#f08a5d"/>
    </linearGradient>
    <radialGradient id="sun" cx="146" cy="56" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dirt" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#4a2f1f"/>
      <rect x="1" y="1" width="2" height="1" fill="#5f3d27"/>
      <rect x="5" y="3" width="1" height="2" fill="#38231a"/>
      <rect x="2" y="5" width="2" height="1" fill="#6b452c"/>
      <rect x="6" y="6" width="1" height="1" fill="#38231a"/>
    </pattern>
    <pattern id="stone" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#3a3646"/>
      <rect x="1" y="2" width="3" height="1" fill="#4a4558"/>
      <rect x="5" y="5" width="2" height="1" fill="#2b2835"/>
      <rect x="2" y="6" width="1" height="1" fill="#2b2835"/>
    </pattern>
  </defs>
  <rect width="192" height="108" fill="url(#sky)"/>
  <rect width="192" height="108" fill="url(#sun)"/>
  <rect x="140" y="48" width="12" height="12" fill="#ffd98a"/>
  <rect x="142" y="50" width="8" height="8" fill="#ffe9b8"/>
  <g fill="#fff" opacity=".7">
    <rect x="18" y="8" width="1" height="1"/><rect x="52" y="14" width="1" height="1"/><rect x="88" y="6" width="1" height="1"/>
    <rect x="120" y="12" width="1" height="1"/><rect x="170" y="8" width="1" height="1"/>
  </g>
  <!-- clouds -->
  <g fill="#e9b5e0" opacity=".35">
    <rect x="20" y="24" width="28" height="4"/><rect x="26" y="20" width="14" height="4"/>
    <rect x="96" y="30" width="22" height="3"/><rect x="164" y="22" width="20" height="4"/>
  </g>
  <!-- far mountains -->
  <g fill="#3b1d5e">
    <rect x="0" y="56" width="16" height="20"/><rect x="16" y="50" width="12" height="26"/><rect x="28" y="44" width="10" height="32"/>
    <rect x="38" y="52" width="14" height="24"/><rect x="52" y="58" width="20" height="18"/>
    <rect x="100" y="54" width="14" height="22"/><rect x="114" y="46" width="12" height="30"/><rect x="126" y="56" width="18" height="20"/>
    <rect x="168" y="50" width="12" height="26"/><rect x="180" y="58" width="12" height="18"/>
  </g>
  <g fill="#e7d7ff" opacity=".6">
    <rect x="28" y="44" width="10" height="2"/><rect x="114" y="46" width="12" height="2"/><rect x="168" y="50" width="12" height="2"/>
  </g>
  <g fill="#2a1546">
    <rect x="0" y="66" width="30" height="12"/><rect x="60" y="64" width="26" height="14"/><rect x="86" y="68" width="40" height="10"/>
    <rect x="150" y="64" width="42" height="14"/>
  </g>
  <!-- water -->
  <rect x="104" y="80" width="88" height="28" fill="#2c3f9e"/>
  <g fill="#6a7fe0" opacity=".7">
    <rect x="112" y="84" width="10" height="1"/><rect x="132" y="88" width="14" height="1"/><rect x="156" y="83" width="8" height="1"/>
    <rect x="170" y="92" width="12" height="1"/><rect x="120" y="96" width="9" height="1"/>
  </g>
  <rect x="138" y="80" width="16" height="28" fill="#ffc77a" opacity=".22"/>
  <!-- land -->
  <rect x="0" y="80" width="112" height="28" fill="url(#dirt)"/>
  <rect x="0" y="72" width="64" height="8" fill="url(#dirt)"/>
  <rect x="0" y="72" width="64" height="2" fill="#3f8a3a"/>
  <rect x="64" y="80" width="48" height="2" fill="#3f8a3a"/>
  <rect x="0" y="74" width="64" height="1" fill="#2f6b2c"/>
  <rect x="0" y="96" width="112" height="12" fill="url(#stone)"/>
  <!-- trees -->
  <rect x="14" y="60" width="2" height="12" fill="#5a3a22"/>
  <rect x="8" y="50" width="14" height="10" fill="#2c6326"/><rect x="10" y="46" width="10" height="4" fill="#34732d"/>
  <rect x="11" y="52" width="3" height="2" fill="#4a9a3f"/>
  <rect x="44" y="62" width="2" height="10" fill="#5a3a22"/>
  <rect x="39" y="54" width="12" height="8" fill="#2c6326"/><rect x="41" y="50" width="8" height="4" fill="#34732d"/>
  <rect x="90" y="70" width="2" height="10" fill="#5a3a22"/>
  <rect x="85" y="62" width="12" height="8" fill="#2c6326"/><rect x="87" y="58" width="8" height="4" fill="#34732d"/>
  <!-- small house -->
  <rect x="66" y="70" width="14" height="10" fill="#8a5a33"/>
  <rect x="64" y="66" width="18" height="4" fill="#5b3a22"/>
  <rect x="71" y="74" width="4" height="6" fill="#3a2414"/>
  <rect x="67" y="72" width="3" height="3" fill="#ffd27a"/>
  <rect x="76" y="72" width="3" height="3" fill="#ffd27a"/>
</svg>
